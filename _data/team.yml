- name: Sandy Trust
  role: IFoA Planetary Solvency Lead
  bio:
    - Sandy is a Scottish sustainability actuary who developed the Planetary Solvency concept and has led the research agenda since the first report in 2022, pioneering the collaborative approach that defines our working style. He brings over 20 years’ financial services experience across pensions, savings and investment, including advising several regulatory and policy climate initiatives.
    - Sandy previously set up the UK branch of the climate change action charity Protect Our Winters UK.
- name: Jesse Abrams
  role: Science Lead
  bio:
    - Jesse is an Assistant Professor at the University of Exeter's Global Systems Institute. His interdisciplinary research focuses on understanding and quantifying human-induced changes on our natural environment, which sits at the critical intersection of Earth system science, climate change, and sustainability solutions.
    - With over 5,000 citations and 83+ publications, Jesse’s research spans climate science, biodiversity conservation, ecosystem tipping points, and complex systems analysis.
- name: Jenny Poulter
  role: Business Engagement Lead
  bio:
    - Jenny has spent many years working in sustainability, thought leadership and systems change, latterly with the advisory firm Volans.
    - As a former journalist, producer and editorial head of a business media start-up, Jenny has led partnerships with organisations including BBC Worldwide, The Telegraph Group and Harvard Business School Publishing. Through her experience as co-founder of two leaders’ networks, Jenny’s interest has crystallised around how to spark meaningful relationships and collaboration across silos - something she believes is key to moving the post-sustainability world towards repair and regeneration.
- name: Alex Wilks
  role: Title to be confirmed
  bio:
    - Alex is a campaigner and researcher who has worked on climate issues since the early 1990s. For a decade he led international civil society coalitions which called on the World Bank, IMF and other financial institutions to act in favour of the global south. Later at Avaaz he contributed to a two-year push to show that citizens wanted what became the Paris Agreement. More recently - with both Sunrise Project and Client Earth - he has worked to challenge pension funds to act on climate risk.
    - Alex also sings (bass) with the Climate Choir Movement and is part of the core group that organises its actions.
