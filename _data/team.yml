- name: Jesse Abrams
  role: Science Lead
  bio:
    - Jesse is an Assistant Professor at the University of Exeter's Global Systems Institute. His interdisciplinary research focuses on understanding and quantifying human-induced changes on our natural environment, which sits at the critical intersection of Earth system science, climate change, and sustainability solutions.
    - With over 5,000 citations and 83+ publications, Jesse’s research spans climate science, biodiversity conservation, ecosystem tipping points, and complex systems analysis.
- name: Jenny Poulter
  role: Business Engagement Lead
  bio:
    - Jenny has spent over 25 years working in sustainability, thought leadership and systems change, latterly with the advisory firm Volans.
    - As a former journalist, producer and editorial head of a media start-up, Jenny has led partnerships with many international corporate and academic organisations. Through her experience as co-founder of two leaders’ networks, her interest has crystallised around how to spark meaningful relationships and collaboration across silos - key to moving the post-sustainability world towards repair and regeneration. 
- name: Oliver (Ollie) Cronk
  role: Technology Lead (Fractional CTO)
  linkedin: "https://www.linkedin.com/in/cronky/"
  bio:
    - Ollie is an independent Chief Architect and the founder of <a href="https://cronkadvisory.com">Cronk Advisory</a>, working across responsible tech and sustainability. He leads the team providing Planetary Solvency digital foundations, building the website, tools and platforms.
    - A long-standing advocate for sustainable technology, part of the UK Government Digital Sustainability Alliance (<a href="https://www.gov.uk/government/groups/government-digital-sustainability-alliance-gdsa">GDSA</a>) and is a key part of the team developing the <a href="https://dist.greenweb.org/">Digital Impacts Schema and Taxonomy (DIST)</a>, an open framework helping organisations categorise and report the environmental impacts of their digital technology. He is also the founder and co-host of <a href="https://architecttomorrow.com">Architect Tomorrow</a>. 
    - Ollie is a keen Cyclist and Photographer.
- name: Gareth Slevin
  role: Actuarial Intern
  bio:
    - Gareth is a student undertaking an intern role providing support for Planetary Solvency. He has a keen interest in sustainability and climate change.
