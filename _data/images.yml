# The image library. Each key is an image id used in front matter (e.g. `hero_image: cloud2`)
# and in _data/home_sections.yml. The files themselves are in assets/images/library/ and are
# produced by `node scripts/process-images.mjs` (see EDITING.md); the sizes available are
# listed in the generated _data/image_files.yml.
#
#   alt      Describes the picture for screen readers. Use "" only if the image is purely decorative.
#   credit   Photographer or source, shown nowhere yet but kept for the record.
#   licence  Terms the image can be used under.
#   focal    Optional. Which part of the picture stays in view when the hero is cropped,
#            as a CSS object-position, e.g. "50% 30%". Default is the centre.
#
# TODO: credit and licence are still TO CONFIRM for every image.
