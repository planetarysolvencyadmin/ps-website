name: Validate site

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow only checks things, it never writes to the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Pinned to a version tag, not a commit SHA. The Scorecard workflow may flag this; pin it
      # to a SHA when convenient (Dependabot can keep it up to date).
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check content and data
        run: ruby scripts/validate-site.rb

      - name: Build the site
        run: bundle exec jekyll build --strict_front_matter

      - name: Look for template errors in the built site
        run: |
          if grep -rIl "Liquid error\|Liquid syntax error" _site; then
            echo "A page contains a Liquid error (listed above)." >&2
            exit 1
          fi

      - name: Check the contact function
        run: node --test tests/contact.test.mjs
