---
title: Planetary Solvency
timezone: Europe/London
collections:
  posts:
    title: Posts
    output: true
  uploads:
    title: Uploads
    output: true
tagline: A systems approach to global risk management for human prosperity.
description: Planetary Solvency is a systems approach to understanding and managing
  global risk in support of long-term human prosperity.
url: https://test.planetarysolvency.org
baseurl: 
markdown: kramdown
permalink: "/news/:title/"
plugins:
- jekyll-sitemap
- jekyll-feed
sass:
  style: compressed
exclude:
- functions
- tests
- Gemfile
- Gemfile.lock
- README.md
- vendor
- node_modules
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      # news or commentary: decides which list the post appears in on /press-and-commentary/
      kind: news
      # optional: a web address to link straight to (e.g. a media clip); leave blank for a normal post
      link: ""
      # optional: publication or outlet name shown with the date
      source: ""
