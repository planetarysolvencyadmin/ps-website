<div class="report-grid">
{% for r in site.data.reports %}
<article class="report-card">
{% if r.image %}<a class="report-thumb" href="{{ r.url }}"><img src="{{ r.image | relative_url }}" alt="Cover of {{ r.title }}"></a>{% else %}<a class="report-thumb placeholder" href="{{ r.url }}" aria-hidden="true" tabindex="-1">{{ r.year }}</a>{% endif %}
<div class="report-body">
<h3><a href="{{ r.url }}">{{ r.year }}: {{ r.title }}</a></h3>
<p>{{ r.summary }}</p>
<p class="report-links">{% if r.pdf == r.url %}<a href="{{ r.pdf }}" aria-label="Download PDF: {{ r.title | escape }} ({{ r.year }})">Download PDF</a>{% else %}<a href="{{ r.url }}" aria-label="Read online: {{ r.title | escape }} ({{ r.year }})">Read online</a>{% if r.pdf %} | <a href="{{ r.pdf }}" aria-label="Download PDF: {{ r.title | escape }} ({{ r.year }})">Download PDF</a>{% endif %}{% endif %}</p>
</div>
</article>
{% endfor %}
</div>
