<header class="site-header">
  <div class="wrap">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Planetary Solvency, home" width="160" height="45">
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul class="nav-list">
        {% for section in site.data.navigation %}
        <li><a class="nav-top" href="{{ section.url | relative_url }}"{% if page.url == section.url %} aria-current="page"{% endif %}>{{ section.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
