<footer class="site-footer">
  <div class="wrap">
    <nav class="footer-nav" aria-label="Footer">
      {% for link in site.data.footer %}
      <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
      {% endfor %}
      {% if site.data.analytics.enabled %}<button type="button" class="footer-link-button" data-cookie-settings>Cookie settings</button>{% endif %}
    </nav>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}.</p>
  </div>
</footer>
