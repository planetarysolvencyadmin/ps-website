<ul class="questions">
{% for r in site.data.reports %}
<li>
<a href="{{ r.url }}">
{% if r.cover %}{% include report-cover.html id=r.cover title=r.title sizes="64px" class="question-cover" %}{% endif %}
<span class="question-body"><span class="question-text">{{ r.question }}</span> <small>{{ r.title }} ({{ r.year }})</small></span>
</a>
</li>
{% endfor %}
</ul>
